<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remote User</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: url("{% static 'bg.jpg' %}");
            background-size: cover;
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa; /* Light gray background */
            color: #444; /* Dark gray text color */
        }

        h1 {
            color: #1e3a8a; /* Deep Blue */
            text-align: center;
            font-size: 38px;
            margin-top: 30px;
        }

        .topnav {
            overflow: hidden;
            background: linear-gradient(to right, #344CB7, #60a5fa); /* Navigation bar gradient */
        }

        .topnav a {
            float: left;
            color: #FFFFFF;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: #93c5fd; /* Very Light Blue */
            color: #1e3a8a; /* Deep Blue */
        }

        .topnav a.active {
            background-color: #8e4fd1; /* Deep Purple */
            color: white;
        }

        .alert {
background-color: #1e3a8a;
            color: #1e3a8a; /* Deep Blue text */
            font-weight: bold;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); /* Banner shadow */
        }

        .alert a {
            color:#f8f9fa;
            text-decoration: none;
            margin: 0 10px;
        }

        .alert a:hover {
            color: #3b82f6; /* Bright Blue on hover */
        }

        .mainholder {
            margin: 40px auto;
            width: 80%;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 28px;
            }

            .topnav a {
                font-size: 14px;
            }

            .alert {
                padding: 10px;
                font-size: 14px;
            }

            .mainholder {
                width: 90%;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            .topnav a {
                font-size: 12px;
            }

            .alert {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<h1>Detecting Phishing Effectively: A Stable and Adaptable Mechanism</h1>

<div class="tab-content tab-space">
    <div class="tab-pane active" id="preview-alerts">
        <div class="container py-5">
            <div class="alert alert-success text-white font-weight-bold" role="alert">
                <a href="{% url 'Predict_Message_Type' %}">PREDICT MESSAGE TYPE</a> ||
                <a href="{% url 'ViewYourProfile' %}">VIEW YOUR PROFILE</a> ||
                <a href="{% url 'index' %}">LOGOUT</a>
            </div>
        </div>
    </div>
</div>

<div class="mainholder">
    {% block userblock %}
    {% endblock %}
</div>

</body>
</html>
