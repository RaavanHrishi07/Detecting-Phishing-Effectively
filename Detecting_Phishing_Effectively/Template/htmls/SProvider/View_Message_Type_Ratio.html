{% extends 'SProvider/Header.html' %}

{% block researchblock %}

<link rel="icon" href="images/icon.png" type="image/x-icon" />
<link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet">

<style>
    /* Global Styling */
    body {
        background: linear-gradient(135deg, #f8f9fa, #e0e7ff); /* Gradient from light gray to lavender blue */
                    font-family: 'Poppins', sans-serif;

        color: #444; /* Dark gray text */
        margin: 0;
        padding: 0;
    }

    /* Container Styling */
    .container-fluid {
        padding: 50px;
        background: rgba(255, 255, 255, 0.95); /* Semi-transparent white background */
        border-radius: 20px;
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.3); /* Shadow effect */
        margin-top: 50px;
    }

    .container {
        background: linear-gradient(135deg, #1e3a8a, #3b82f6); /* Gradient from deep blue to bright blue */
        padding: 50px;
        border-radius: 10px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    #title {
                    font-family: 'Poppins', sans-serif;

        font-size: 28px;
        color: #1e3a8a; /* Deep blue for titles */
        text-align: center;
        margin-bottom: 30px;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3); /* Header shadow */
    }

    .text-uppercase {

font-family: 'Poppins', sans-serif;
font-weight: bold;
        font-size: 28px;
        color: #f8f9fa; /* Deep blue for text */
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 30px;
        letter-spacing: 3px;
    }

    /* Table Styling */
    table {
    font-family: 'Poppins', sans-serif;
        width: 100%;
        border-collapse: collapse;
        margin-top: 30px;
        background: #1e3a8a; /* Deep blue for the table */
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    th, td {
        padding: 20px;
        text-align: center;
        font-size: 18px;
        color: #f3f4f6; /* Light gray text for table */
        transition: background-color 0.3s ease, color 0.3s ease;

    }

    th {
        background-color: #1e3a8a; /* Deep blue for header */
        color: white;
        font-size: 20px;
        font-weight: bold;
    }

    td {
        background-color: #ffffff;
        color: #344CB7; /* Medium blue text for data */
        font-family: 'Poppins', sans-serif;

    }

    td:hover {
        background-color: #93c5fd; /* Very light blue hover effect */
        color: #1e3a8a; /* Deep blue on hover */
        cursor: pointer;
    }

    /* Button Styling */
    .btn {
        background-color: #344CB7; /* Medium blue background */
        color: white;
        padding: 10px 20px;
        font-size: 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .btn:hover {
        background-color: #60a5fa; /* Light blue on hover */
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .container {
            padding: 30px;
        }

        #title {
            font-size: 28px;
        }

        .text-uppercase {
        font-family: 'Poppins', sans-serif;
            font-size: 24px;
        }

        table {
            margin-top: 20px;
        }

        th, td {
            font-size: 16px;
        }

        .tweettext {
            width: 100%;
            height: 300px;
        }
    }
</style>

<body>
    <div class="container-fluid">
        <div class="container">
            <div class="row">
                <div class="col-md-5">
                    <form role="form" method="POST">
                        {% csrf_token %}
                        <fieldset>
                            <p align="center"  class="text-uppercase pull-center " >View Message Type Found Ratio Details</p>
                            <hr>
                            <div>
                               <table border="5" align="center" bordercolor="">
                                  <tr>
                                      <td bgcolor="#344CB7"><div align="center"><span class="style10 style7">Message Type</span></div></td>
                                      <td bgcolor="#344CB7"><div align="center"><span class="style10 style7">Ratio</span></div></td>
                                  </tr>
                                  {% for object in objs %}
                                  <tr>
                                      <td bgcolor="#344CB7" style="color:#344CB7; font-size:20px; font-family: 'Poppins', sans-serif;"><div align="center">{{object.names}}</div></td>
                                      <td bgcolor="#344CB7" style="font-family:monospace; font-size:19px;"><div align="center" class="style9"><span class="style7">{{object.ratio}}</span></div></td>
                                  </tr>
                                  {% endfor %}
                               </table>
                            </div>
                        </fieldset>
                    </form>
                </div>
                <div class="col-md-2">
                    <!-- Empty space for layout -->
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
