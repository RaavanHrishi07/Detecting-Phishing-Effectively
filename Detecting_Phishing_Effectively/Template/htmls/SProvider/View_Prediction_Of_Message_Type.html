{% extends 'SProvider/Header.html' %}

{% block researchblock %}

<link rel="icon" href="images/icon.png" type="image/x-icon" />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
    /* Global Styling */
    body {
        background: linear-gradient(135deg, #f8f9fa, #e0e7ff); /* Gradient from very light gray to lavender blue */
                    font-family: 'Poppins', sans-serif;

        color: #444; /* Dark gray text for better readability */
        margin: 0;
        padding: 0;
    }

    /* Main container styling */
    .container-fluid {
        padding: 50px;
        background: rgba(255, 255, 255, 0.95); /* Semi-Transparent White */
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        margin-top: 50px;
    }

    .container {
        padding: 50px;
        background: linear-gradient(135deg, #1e3a8a, #3b82f6); /* Gradient from deep blue to bright blue */
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    #title {
                    font-family: 'Poppins', sans-serif;
        font-size: 28px;
        color: #1e3a8a; /* Deep blue for titles */
        text-align: center;
        margin-bottom: 30px;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3); /* Header shadow */
    }

    .text-uppercase {
                    font-family: 'Poppins', sans-serif;
font-weight: bold;
        font-size: 28px;
        color: #f8f9fa; /* Deep blue */
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 20px;
        letter-spacing: 2px;
    }

    /* Table Styling */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 30px;
        background-color: #1e2a47; /* Deep blue background for the table */
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    th, td {
        padding: 20px;
        text-align: center;
        font-size: 18px;
        color: #f3f4f6; /* Light gray for text */
    }

    th {
        background-color: #1e3a8a; /* Deep blue for header */
        color: white;
        font-size: 20px;
        font-weight: bold;
    }

    td {
        background-color: #ffffff;
        color: #1e3a8a; /* Deep blue text color for table data */
        font-family: 'Poppins', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    td:hover {
        background-color: #93c5fd; /* Very light blue on hover */
        color: #1e3a8a; /* Deep blue text on hover */
        cursor: pointer;
    }

    /* Custom Styles */
    .style1 {
        color: #1e3a8a; /* Medium blue */
        font-weight: bold;
    }

    .style12 {
        color: #f44336; /* Red for emphasis */
        font-weight: bold;
    }

    .style8 {
        font-size: 24px;
    }

    .style6 {
        font-size: 28px;
        font-weight: bold;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .container {
            padding: 30px;
        }

        #title {
            font-size: 28px;
        }

        .text-uppercase {
            font-size: 24px;
        }

        table {
            margin-top: 20px;
        }

        th, td {
            font-size: 16px;
        }
    }

</style>

<body>
    <div class="container-fluid">
        <div class="container">
            <div class="row">
                <div class="col-md-5">
                    <form role="form" method="POST">
                        {% csrf_token %}
                        <fieldset>
                            <p class="text-uppercase pull-center ">View Message Type Prediction Details</p>
                            <hr>
                            <div>
                                <table border="1">
                                    <tr>
                                        <th><span class="style8 style6">Message</span></th>
                                        <th><span class="style8 style6">Prediction</span></th>
                                    </tr>
                                    {% for object in list_objects %}
                                    <tr>
                                        <td>{{object.Message}}</td>
                                        <td>{{object.Prediction}}</td>
                                    </tr>
                                    {% endfor %}
                                </table>
                            </div>
                        </fieldset>
                    </form>
                </div>
                <div class="col-md-2">
                    <!-- Empty Column for Spacing -->
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
